<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - PLAYZONE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #080d1b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .game {
            max-width: 450px;
            margin: 50px auto;
            background: #121e38;
            padding: 30px 20px;
            border: 1px solid #00e5ff;
            border-radius: 15px;
        }

        h1 {
            color: #00e5ff;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 30px 0;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #00e5ff;
            font-size: 22px;
            cursor: pointer;
        }

        button:hover {
            background: #00bcd4;
        }

        .reset {
            font-size: 15px;
            padding: 12px 25px;
            margin-top: 15px;
        }

        #result {
            font-size: 19px;
            margin: 25px 0;
            color: #00e5ff;
        }

        a {
            display: block;
            margin-top: 25px;
            color: #00e5ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>✊ Rock Paper Scissors</h1>

    <p>Choose your move!</p>

    <div class="choices">
        <button onclick="play('rock')">✊</button>
        <button onclick="play('paper')">✋</button>
        <button onclick="play('scissors')">✌️</button>
    </div>

    <p id="player">Your choice: -</p>
    <p id="computer">Computer's choice: -</p>

    <h2 id="result">Let's play!</h2>

    <p>Player Score: <span id="playerScore">0</span></p>
    <p>Computer Score: <span id="computerScore">0</span></p>

    <button class="reset" onclick="resetGame()">Reset Game</button>

    <a href="/">← Back to PLAYZONE</a>

</div>

<script>

    let playerScore = 0;
    let computerScore = 0;

    function play(playerChoice) {

        const choices = ['rock', 'paper', 'scissors'];

        const computerChoice =
            choices[Math.floor(Math.random() * 3)];

        document.getElementById("player").textContent =
            "Your choice: " + playerChoice;

        document.getElementById("computer").textContent =
            "Computer's choice: " + computerChoice;

        let result = "";

        if (playerChoice === computerChoice) {

            result = "🤝 It's a draw!";

        } else if (
            (playerChoice === 'rock' && computerChoice === 'scissors') ||
            (playerChoice === 'paper' && computerChoice === 'rock') ||
            (playerChoice === 'scissors' && computerChoice === 'paper')
        ) {

            result = "🎉 You win!";
            playerScore++;

        } else {

            result = "Computer wins!";
            computerScore++;

        }

        document.getElementById("result").textContent = result;

        document.getElementById("playerScore").textContent =
            playerScore;

        document.getElementById("computerScore").textContent =
            computerScore;

    }

    function resetGame() {

        playerScore = 0;
        computerScore = 0;

        document.getElementById("playerScore").textContent = 0;
        document.getElementById("computerScore").textContent = 0;

        document.getElementById("player").textContent = "Your choice: -";
        document.getElementById("computer").textContent = "Computer's choice: -";
        document.getElementById("result").textContent = "Let's play!";

    }

</script>

</body>
</html>
